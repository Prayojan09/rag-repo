services:
  migrate:
    build: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
      UPLOAD_DIR: /srv/backend/data/uploads
      HF_HOME: /cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/srv/backend/data/uploads
      - models_cache:/cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
    restart: unless-stopped

volumes:
  uploads_data:
  models_cache:
