services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      LLM_GATEWAY_BASE_URL: ${DOCKER_LLM_GATEWAY_BASE_URL:-http://host.docker.internal:8000/v1}
      UPLOAD_DIR: /srv/backend/data/uploads
      HF_HOME: /cache/huggingface
    ports:
      - "8001:8001"
    volumes:
      - uploads_data:/srv/backend/data/uploads
      - models_cache:/cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
  models_cache:
